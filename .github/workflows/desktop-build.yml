name: Botora Desktop

on:
  push:
    branches:
      - work_desktop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact: Botora-Windows
            file: frontend/release/*.exe
          - os: ubuntu-22.04
            target: linux
            artifact: Botora-Ubuntu
            file: frontend/release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install backend dependencies for tests
        run: npm ci
        working-directory: backend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run desktop:dist:win
        working-directory: frontend

      - name: Package Ubuntu installer
        if: runner.os == 'Linux'
        run: npm run desktop:dist:linux
        working-directory: frontend

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 30
